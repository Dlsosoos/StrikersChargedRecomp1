name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      native:
        description: "Compilar o motor nativo (-PenableNative)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build (somente menu)
        if: ${{ inputs.native != true }}
        run: gradle assembleDebug

      - name: Build (com motor nativo)
        if: ${{ inputs.native == true }}
        run: gradle assembleDebug -PenableNative

      - uses: actions/upload-artifact@v4
        with:
          name: StrikersRecomp-debug
          path: app/build/outputs/apk/debug/*.apk
